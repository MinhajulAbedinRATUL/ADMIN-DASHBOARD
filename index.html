<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div id="container">
    <header class="header">
      <div class="search">
        <img src="./img/magnify.svg" alt="search logo" width="24" height="24">
        <form>
            <input type="search" name="search">
        </form>
      </div>
      <div class="notification-profile">
        <img src="./img/bell-ring.svg" alt="notification logo" width="24" height="24">
        <img src="./img/profile1.jpg" alt="anime girl in sunglass" width="236" height="236">
        <p class="name">Minhajul Abedin Ratul</p>
      </div>
      <div class="dp">
        <img src="./img/profile1.jpg" alt="anime girl in sunglass" width="236" height="236">
        <div>
        <p>Hi there,</p>
        <p>Minhajul Abedin Ratul (@ratul)</p>
        </div>
      </div>
      <div class="new-upload-share">
        <div class="new">New</div>
        <div class="upload">Upload</div>
        <div class="share">Share</div>
      </div>
    </header>
    <div id="dashboard">
      <div class=" dashboard logo">
        <img  src="./img/view-dashboard.svg" alt="dashboard logo">
         <p>Dashboard</p>
      </div>
      <div class=" profile logo">
        <img src="./img/id-card.png" alt="profile logo">
         <p>Profile</p>
      </div>
      <div class=" messsages logo">
        <img src="./img/message-reply.svg" alt="messages logo">
         <p>Messages</p>
      </div>
      <div class=" history logo">
        <img src="./img/history.png" alt="history logo">
         <p>History</p>
      </div>
      <div class=" tasks logo">
        <img src="./img/file-multiple.svg" alt="tasks logo">
         <p>Tasks</p>
      </div>
      <div class=" community logo">
        <img src="./img/group.png" alt="community logo">
         <p>Community</p>
      </div>
      <div class=" settings logo">
        <img src="./img/cog.svg" alt="settings logo">
         <p>Settings</p>
      </div>
      <div class=" support logo">
        <img src="./img/help-box.svg" alt="support logo">
         <p>Support</p>
      </div>
      <div class=" privacy logo">
        <img src="./img/shield-check.svg" alt="privacy logo">
         <p>Privacy</p>
      </div>
    </div>
    <div class="projects">

    </div>
    <div class="announcements">

    </div>
    <div class="trending">

    </div>
  </div>
</body>
</html>
